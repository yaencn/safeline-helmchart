  podAnnotations: {}
  serviceAccountName: ""
  automountServiceAccountToken: false
  replicas: 1
  revisionHistoryLimit: 10
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName:
  securityContext:
