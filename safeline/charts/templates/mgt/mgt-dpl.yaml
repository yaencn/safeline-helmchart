apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "safeline.mgt" . }}
  labels:
{{ include "safeline.labels" . | indent 4 }}
    component: mgt
spec:
  replicas: {{ .Values.mgt.replicas }}
  revisionHistoryLimit: {{ .Values.mgt.revisionHistoryLimit }}
  {{- $strategy := .Values.mgt.strategy | default .Values.strategy }}
  {{- if $strategy }}
  strategy:
{{ toYaml $strategy | indent 4 }}
  {{- end }}
  selector:
    matchLabels:
{{ include "safeline.matchLabels" . | indent 6 }}
      component: mgt
  template:
    metadata:
      labels:
{{ include "safeline.matchLabels" . | indent 8 }}
        component: mgt
      annotations:
{{- if .Values.mgt.podAnnotations }}
{{ toYaml .Values.mgt.podAnnotations | indent 8 }}
{{- end }}
    spec:
{{- if .Values.mgt.serviceAccountName }}
      serviceAccountName: {{ .Values.mgt.serviceAccountName }}
{{- end -}}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.mgt.automountServiceAccountToken | default false }}
      terminationGracePeriodSeconds: 120
      initContainers:
      - name: delete-lost-found-dir
        image: {{ default .Values.global.image.registry .Values.mgt.image.registry }}/{{ .Values.mgt.image.repository }}{{ .Values.global.image.region }}:{{ default .Chart.AppVersion .Values.mgt.image.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        command:
          - sh
          - -c
          - |-
            rm -rf /app/data/lost+found && while true; do sleep 3 && nc -zvw1 {{ template "safeline.database.host" . }} 5432 && nc -zvw1 {{ template "safeline.fvm" . }} 80 && exit 0 || sleep 3; done; exit 1
        volumeMounts:
          - mountPath: /app/data
            name: mgt
      containers:
      - name: mgt
        image: {{ default .Values.global.image.registry .Values.mgt.image.registry }}/{{ .Values.mgt.image.repository }}{{ .Values.global.image.region }}:{{ default .Chart.AppVersion .Values.mgt.image.tag }}
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        {{- with .Values.mgt.securityContext }}
        securityContext:
{{ toYaml . | indent 10 }}
        {{- end }}
        ports:
          - name: web
            containerPort: {{ template "safeline.mgt.web.port" . }}
          - name: api
            containerPort: {{ template "safeline.mgt.api.port" . }}
          - name: tcd
            containerPort: {{ template "safeline.mgt.tcd.port" . }}
        envFrom:
        - configMapRef:
            name: {{ template "safeline.mgt.env" . }}
        - secretRef:
            name: "{{ template "safeline.database" . }}-url"
        volumeMounts:
          - mountPath: /app/data
            name: mgt
          {{- if .Values.global.localtime.enabled }}
          - name: localtime
            mountPath: /etc/localtime
            readOnly: true
          {{- end }}
          - name: nginx-log
            mountPath: /app/log/nginx
          - name: safeline-sock-dir
            mountPath: /app/run
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  # 等 entrypoint 生成基线白名单（文件非空即说明 line 44 已执行，之后不会再覆盖）
                  i=0; while [ ! -s /app/data/nginx_inner_allow.conf ] && [ $i -lt 60 ]; do i=$((i+1)); sleep 1; done
                  # 幂等追加 pod 网段
                  grep -q 'allow 0.0.0.0/0' /app/data/nginx_inner_allow.conf || \
                    printf 'allow 0.0.0.0/0;\n' >> /app/data/nginx_inner_allow.conf
                  # 通知 nginx；nginx 未就绪则重试。hook 必须最终退出 0，否则容器会被判定失败
                  i=0; until nginx -s reload 2>/dev/null || [ $i -ge 10 ]; do i=$((i+1)); sleep 3; done
                  exit 0
        livenessProbe:
          httpGet:
            scheme: HTTPS
            port: 1443
            path: /api/open/health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            scheme: HTTPS
            port: 1443
            path: /api/open/health
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
{{- if .Values.mgt.resources }}
        resources:
{{ toYaml .Values.mgt.resources | indent 10 }}
{{- end }}
      volumes:
        {{- if .Values.global.localtime.enabled }}
        - name: localtime
          hostPath:
            path: /etc/localtime
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: mgt
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.persistentVolumeClaim.mgt.existingClaim | default (include "safeline.mgt" .) }}
        - name: nginx-log
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.persistentVolumeClaim.tengineLogs.existingClaim | default (include "safeline.tengine-logs" .) }}
        - name: safeline-sock-dir
          emptyDir: {}
        {{- else -}}
        - name: mgt
          emptyDir: {}
        - name: nginx-log
          emptyDir: {}
        - name: safeline-sock-dir
          emptyDir: {}
        {{- end -}}

    {{- with .Values.mgt.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.mgt.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- with .Values.mgt.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
    {{- end }}
    {{- if .Values.mgt.priorityClassName }}
      priorityClassName: {{ .Values.mgt.priorityClassName }}
    {{- end }}
